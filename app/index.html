  <style>#luma-load{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:linear-gradient(180deg,#D9D3EF 0%,#EDE3F0 35%,#F6E2CF 70%,#FAF6EF 100%);font:600 15px/1.4 Inter,system-ui,sans-serif;color:#3B5547;transition:opacity .4s}#luma-load .s{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#F7D98B,#EBC26A 70%);box-shadow:0 0 70px 24px rgba(247,217,139,.45);animation:lp 2.4s ease-in-out infinite alternate}#luma-load b{font:500 34px/1 'Cormorant Garamond',Georgia,serif}@keyframes lp{to{transform:scale(1.08)}}#luma-load .f{display:none;flex-direction:column;align-items:center;gap:12px;max-width:300px;text-align:center;margin-top:6px}#luma-load.slow .f{display:flex}#luma-load .f p{margin:0;font-weight:500;color:#4D6658}#luma-load .f button{border:0;border-radius:999px;background:#4C6B5A;color:#fff;font:600 15px Inter,system-ui,sans-serif;padding:12px 28px;cursor:pointer}#luma-load .f small{display:none;font-weight:500;color:#5E7568;font-size:13px}#luma-load.inapp .f small{display:block}</style>

<body style="background:#FAF6EF;margin:0">
  <div id="luma-load" aria-label="Loading LumaPace"><div class="s"></div><b>LumaPace</b><span>Preparing your calm session…</span><div class="f" role="status"><p>Taking longer than usual.</p><button type="button" id="luma-reload">Reload</button><small>Using Instagram or Facebook? Tap ⋯ and choose “Open in browser”.</small></div></div>
  <script>window.addEventListener("flutter-first-frame",function(){var l=document.getElementById("luma-load");if(l){l.style.opacity=0;setTimeout(function(){l.remove()},450)}});</script>
  <script>(function(){var l=document.getElementById("luma-load");if(/Instagram|FBAN|FBAV|FB_IAB/i.test(navigator.userAgent))l.classList.add("inapp");setTimeout(function(){if(document.getElementById("luma-load"))l.classList.add("slow")},20000);document.getElementById("luma-reload").onclick=function(){var u=new URL(location.href);u.searchParams.set("r",Date.now());location.replace(u.toString())}})();</script>
